version: "3.8"

# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  nginx:
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  frontend:
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    restart: always

  commander:
    deploy:
      replicas: 3 # Scale API gateway for high availability
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    restart: always

  postgres:
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    restart: always
