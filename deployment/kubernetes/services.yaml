apiVersion: v1
kind: Service
metadata:
  name: commander-service
  namespace: agentverse
spec:
  selector:
    app: commander
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: agentverse
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
