version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: market_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: market_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: market_backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/market_intelligence
      - SAMPLE_DATA_DIR=./sample_data
      - OPENAI_API_KEY=
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./sample-data:/app/sample_data

  frontend:
    build: ./frontend
    container_name: market_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
